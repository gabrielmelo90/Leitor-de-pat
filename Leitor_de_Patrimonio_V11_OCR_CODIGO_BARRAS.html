<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leitor de Patrimônio — V11 OCR + Código de Barras + Excel local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#07101a;
  --panel:#0c1623;
  --panel-2:#101d2c;
  --panel-3:#142337;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.14);
  --text:#f7f9fc;
  --muted:#a7b5c7;
  --dim:#718198;
  --blue:#4d8dff;
  --blue-bg:rgba(77,141,255,.13);
  --orange:#f5a623;
  --orange-bg:rgba(245,166,35,.13);
  --radius:16px;
  --top:64px;
  --sidebar:224px;
  --shadow:0 12px 28px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.body-grid{height:100dvh;display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--top) 1fr}
.sidebar{grid-row:1/3;background:#08111c;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:var(--top);padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand-mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--orange);color:#ffffff}
.brand-name{font:700 14px 'Space Grotesk',sans-serif;letter-spacing:.1px}
.brand-sub{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);text-align:left;font-size:12px;font-weight:600}
.nav button:hover{background:rgba(255,255,255,.03);color:var(--text)}
.nav button.active{background:var(--blue-bg);border-color:rgba(77,141,255,.28);color:var(--text)}
.nav .ico{width:18px;display:grid;place-items:center;opacity:.9}
.nav-count{margin-left:auto;min-width:18px;height:18px;padding:0 6px;border-radius:999px;background:var(--orange);color:#ffffff;display:grid;place-items:center;font-size:9px;font-weight:800}
.side-foot{margin-top:auto;padding:12px 12px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:9.5px;line-height:1.5}
.local-chip{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;font-size:9.5px;margin-bottom:6px}
.local-chip i{width:6px;height:6px;border-radius:50%;background:var(--blue);display:block}
.topbar{grid-column:2;background:#09131f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;position:relative;z-index:1000;min-width:0}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.hamb{display:none}
.crumb{font:600 14px 'Space Grotesk',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;position:relative;z-index:1001;min-width:0}
.global-search{width:min(360px,32vw);height:34px;display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--line-strong);background:var(--panel-2);border-radius:10px;color:var(--muted);flex:0 1 360px;position:relative;z-index:1002}
.global-search input{border:0;outline:0;background:transparent;color:var(--text);width:100%;font-size:11px}
.global-search input::placeholder{color:var(--dim)}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--muted);display:grid;place-items:center;flex:0 0 auto;position:relative;z-index:1002}
.icon-btn:hover{color:var(--text);border-color:var(--line-strong)}
.user-chip{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:0 9px;display:flex;align-items:center;gap:7px;color:var(--text);position:relative;z-index:1002}
.user-chip small{font-size:10px;font-weight:700}
.user-circle{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#ffffff;display:grid;place-items:center;font-size:9px;font-weight:800}
.popover{position:absolute;right:0;top:42px;width:300px;background:#0a1522;border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:11px;display:none;z-index:1100}
.popover.show{display:block}
.pop-title{font:600 11px 'Space Grotesk',sans-serif;margin-bottom:7px}
.pop-row{padding:8px 0;border-top:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.4}
.pop-row strong{display:block;color:var(--text);font-size:10px;margin-bottom:2px}
.main{grid-column:2;min-width:0;min-height:0;overflow:hidden}
.page{height:calc(100dvh - var(--top));padding:14px 16px;overflow:hidden;min-width:0}
.page-inner{height:100%;min-height:0}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:#25344a transparent}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.page-head h1{font:700 22px 'Space Grotesk',sans-serif;margin:0 0 3px}
.page-head p{margin:0;color:var(--muted);font-size:10.5px;line-height:1.5;max-width:740px}
.head-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:0 11px;border-radius:10px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--text);font-size:10.5px;font-weight:700}
.btn:hover{border-color:rgba(255,255,255,.22);background:var(--panel-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#ffffff}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#ffffff}
.btn.small{min-height:30px;padding:0 9px;font-size:9.5px}
.btn.ghost{background:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel.pad{padding:13px}
.panel-title{font:600 12px 'Space Grotesk',sans-serif}
.panel-sub{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-width:0}
.kpi .label{font-size:9px;text-transform:uppercase;letter-spacing:.45px;color:var(--muted)}
.kpi .value{font:700 24px 'Space Grotesk',sans-serif;margin-top:5px;color:var(--blue)}
.kpi.orange .value{color:var(--orange)}
.block-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.home-card{padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);min-height:132px;display:flex;flex-direction:column}
.home-card:hover{border-color:rgba(77,141,255,.28)}
.home-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--panel-3);color:var(--blue);margin-bottom:9px}
.home-card h3{font:600 13px 'Space Grotesk',sans-serif;color:var(--text);margin:0 0 4px}
.home-card p{color:var(--muted);font-size:10px;line-height:1.55;margin:0 0 10px}
.home-card .go{margin-top:auto;font-size:9.5px;color:var(--blue);font-weight:800}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;font-size:8.5px;font-weight:800;border:1px solid var(--line)}
.badge.blue{color:var(--blue);background:var(--blue-bg);border-color:rgba(77,141,255,.25)}
.badge.orange{color:var(--orange);background:var(--orange-bg);border-color:rgba(245,166,35,.25)}
.badge.neutral{color:var(--muted);background:rgba(255,255,255,.035)}
.code{font:600 10px 'JetBrains Mono',monospace;color:var(--blue)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.list-row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.row-title{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:999px;background:#1a2940;overflow:hidden;margin-top:6px}
.bar > span{display:block;height:100%;background:var(--blue);border-radius:inherit}
.form{display:grid;gap:9px}
.field label{display:block;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.45px;color:var(--muted);margin-bottom:4px}
.input,.select,.textarea{width:100%;height:34px;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:9px;padding:0 9px;color:var(--text);outline:0;font-size:10px}
.textarea{height:90px;padding:9px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(77,141,255,.45);box-shadow:0 0 0 2px rgba(77,141,255,.09)}
.table-wrap{height:100%;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:9.5px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{position:sticky;top:0;background:#0b1622;color:var(--muted);text-transform:uppercase;font-size:8px;letter-spacing:.35px;z-index:2}
tr:last-child td{border-bottom:0}
.empty{padding:22px 10px;text-align:center;color:var(--dim);font-size:10px}
.split-page{height:100%;display:grid;grid-template-columns:360px minmax(0,1fr);gap:12px;min-height:0}
.split-left,.split-right{min-height:0;display:flex;flex-direction:column}
.split-right .panel{min-height:0;display:flex;flex-direction:column;height:100%}
.request-list{min-height:0;overflow:auto;padding-right:3px}
.request-card{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:7px;cursor:pointer}
.request-card:hover,.request-card.active{border-color:rgba(77,141,255,.32);background:#0e1a28}
.request-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.request-number{font:700 10px 'JetBrains Mono',monospace;color:var(--blue)}
.request-work{font-size:10.5px;font-weight:700;margin-top:3px}
.request-meta{font-size:8.5px;color:var(--muted);margin-top:3px}
.request-progress{margin-top:7px}
.detail-scroll{overflow:auto;min-height:0;padding-right:2px}
.task{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:9px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.task.done{border-color:rgba(77,141,255,.26);background:rgba(77,141,255,.06)}
.task-check{width:20px;height:20px;border-radius:7px;border:1px solid var(--line-strong);display:grid;place-items:center;background:transparent;color:transparent;flex:0 0 auto}
.task.done .task-check{background:var(--blue);border-color:var(--blue);color:#ffffff}
.task-title{font-size:9.5px;font-weight:700}
.task-meta{font-size:8px;color:var(--muted);margin-top:2px}
.check-modal-back{position:fixed;inset:0;background:rgba(2,7,12,.75);display:none;align-items:center;justify-content:center;z-index:2200;padding:14px}
.check-modal-back.show{display:flex}
.check-modal{width:min(540px,100%);max-height:88dvh;background:#0b1622;border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 22px 50px rgba(0,0,0,.38);display:flex;flex-direction:column;overflow:hidden}
.check-modal-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.check-modal-body{padding:12px;overflow:auto}
.map-layout{height:100%;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:12px;min-height:0}
.map-layout.expanded{grid-template-columns:1fr}.map-layout.expanded .map-side{display:none}
.map-panel{height:100%;min-height:0;display:flex;flex-direction:column}
.map-area{min-height:0;flex:1;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b1622}
#map{width:100%;height:100%}
.map-side{height:100%;min-height:0;display:flex;flex-direction:column;gap:12px}
.map-list{min-height:0;overflow:auto}
.work-card{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:7px}
.work-card:hover{border-color:rgba(77,141,255,.28)}
.work-top{display:flex;justify-content:space-between;gap:8px}
.work-name{font:600 11px 'Space Grotesk',sans-serif}
.work-city{font-size:8.5px;color:var(--muted);margin-top:2px}
.work-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.stat-mini{padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
.stat-mini b{display:block;color:var(--blue);font:700 14px 'Space Grotesk',sans-serif}
.stat-mini span{font-size:7.5px;color:var(--muted);text-transform:uppercase}
.reader-layout{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;min-height:0}
.reader-left,.reader-right{min-height:0;display:flex;flex-direction:column;gap:12px}
.scan-panel{flex:1;min-height:0;display:flex;flex-direction:column}
.camera-shell{min-height:0;flex:1;background:#030911;border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center}
.camera-shell video{width:100%;height:100%;object-fit:cover}
.camera-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.finder{position:absolute;width:66%;aspect-ratio:1.65;border:2px solid var(--orange);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.15);pointer-events:none}
.reader-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.session-panel{display:flex;flex-direction:column;min-height:0}
.session-list{overflow:auto;min-height:0}
.session-card{padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);margin-bottom:7px}
.session-card.active{border-color:rgba(77,141,255,.35)}

/* OCR visual: resultados acessíveis em telas estreitas e no celular. */
.ocr-results{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#081320;min-height:58px}
.ocr-results .ocr-title{font:700 11px 'Space Grotesk',sans-serif;margin-bottom:6px;color:var(--text)}
.ocr-results .ocr-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:130px;overflow:auto;font:10px/1.55 'JetBrains Mono',monospace;color:var(--muted);margin:7px 0}
.ocr-results .ocr-match{padding:9px;margin-top:8px;border:1px solid rgba(77,141,255,.27);border-radius:10px;background:rgba(77,141,255,.06)}
.ocr-results .ocr-match-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.ocr-results .ocr-field{display:grid;grid-template-columns:minmax(90px,.35fr) minmax(0,1fr);gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:10px;overflow-wrap:anywhere}
.ocr-results .ocr-field span{color:var(--muted)}
.ocr-results .ocr-field strong{color:var(--text);font-weight:600;overflow-wrap:anywhere}
.ocr-results .ocr-status{font-size:10px;color:var(--muted);line-height:1.5}
.ocr-results progress{display:block;width:100%;height:6px;margin-top:8px;accent-color:var(--blue)}
.settings .excel-panel{grid-column:1/-1;min-width:0}
.excel-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.excel-preview{max-height:240px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px}
.excel-preview table{min-width:560px}
.excel-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.excel-meta .badge{font-size:9px}
.manual-code-lookup{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2)}
.manual-code-lookup label{display:block;font-size:10px;font-weight:700;color:var(--text);margin-bottom:6px}
.manual-code-lookup .lookup-row{display:flex;gap:7px;align-items:center}
.manual-code-lookup input{flex:1;min-width:0;width:100%;background:#07111e;color:var(--text);border:1px solid var(--line-strong);border-radius:8px;padding:10px;font:12px Inter,sans-serif;outline:none}
.manual-code-lookup input:focus{border-color:var(--blue)}
.manual-code-lookup .lookup-help{font-size:9px;color:var(--muted);margin-top:6px;line-height:1.45}
@media(max-width:520px){.manual-code-lookup .lookup-row{align-items:stretch}.manual-code-lookup .lookup-row .btn{white-space:nowrap;padding-left:10px;padding-right:10px}}
.file-input-label{position:relative;display:inline-flex;align-items:center;gap:8px}
.file-input-label input[type=file]{display:none}
@media(max-width:900px){.settings{height:auto;overflow:visible}.settings .excel-panel{grid-column:auto}.ocr-results{margin-bottom:12px}.reader-actions .btn{min-height:40px}}

.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.photo{aspect-ratio:1.25;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0a1320;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;right:3px;top:3px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:11px}
.asset-layout{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-height:0}
.asset-table{min-height:0}
.asset-toolbar{display:flex;gap:8px;flex-wrap:wrap}
.guide-preview{height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}
.paper{background:#fff;color:#111;border-radius:12px;padding:16px;min-height:0;overflow:auto;font-family:Inter,sans-serif}
.paper h3{margin:0 0 3px;font:700 16px 'Space Grotesk',sans-serif}
.paper .meta{font-size:9px;color:#666;margin-bottom:12px}
.paper table{font-size:9px}
.paper th{position:static;background:#e7eef8;color:#23364d}
.paper td{border-color:#ddd}
.settings{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.settings .panel{padding:14px}
.notice{padding:10px 11px;border-left:3px solid var(--orange);background:var(--orange-bg);font-size:9.5px;color:var(--muted);line-height:1.5;border-radius:9px}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:#0a1522;border:1px solid var(--line-strong);border-radius:999px;padding:9px 14px;font-size:10px;font-weight:700;opacity:0;pointer-events:none;transition:.18s;z-index:3000}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footer-note{position:absolute;left:12px;bottom:10px;font-size:8px;color:var(--dim)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1622;color:var(--text)}
.leaflet-popup-content{font-family:Inter,sans-serif;font-size:10px;line-height:1.45}
.leaflet-control-zoom a{background:#0f1d2d!important;color:#fff!important;border-color:#25354a!important}
.leaflet-control-attribution{background:rgba(7,16,26,.8)!important;color:#92a1b5!important;font-size:8px!important}
.leaflet-control-attribution a{color:#a7b5c7!important}
@media (max-width:1050px){
  :root{--sidebar:200px}
  .global-search{width:260px;flex-basis:260px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .block-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .reader-layout{grid-template-columns:minmax(0,1fr) 300px}
}
@media (max-width:900px){
  html,body{overflow:auto}
  .body-grid{min-height:100dvh;height:auto;display:block}
  .sidebar{position:fixed;inset:auto 0 0 0;height:58px;width:auto;z-index:1500;border-right:0;border-top:1px solid var(--line);flex-direction:row}
  .brand,.side-foot{display:none}
  .nav{padding:5px;display:flex;flex-direction:row;overflow:auto;width:100%}
  .nav button{min-width:96px;justify-content:center;flex-direction:column;gap:2px;padding:6px 7px;font-size:8px}
  .nav-count{position:absolute;margin-left:27px;margin-top:-18px}
  .topbar{position:sticky;top:0;height:var(--top);z-index:1400}

<script>

const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';

const stepsDone=r=>CHECKLIST.filter(c=>r.checklist[c.key]?.done).length;

function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);}

/* =========================================================

   ========================================================= */

    </div>
    <div class="block-grid">
      <button class="home-card" data-go="reader"><span class="home-icon">◫</span><h3>Leitor</h3><p>Inicie uma pasta de leitura para registrar fotos, identificar patrimônios e finalizar a conferência de um pedido.</p><span class="go">Abrir leitor →</span></button>
      <button class="home-card" data-go="requests"><span class="home-icon">☷</span><h3>Solicitações</h3><p>Acompanhe pedidos criados, veja o checklist dentro do dashboard ou crie uma nova solicitação.</p><span class="go">Abrir solicitações →</span></button>
      <button class="home-card" data-go="assets"><span class="home-icon">▣</span><h3>Patrimônios</h3><p>Consulte código, nome, categoria, localização e disponibilidade do patrimônio.</p><span class="go">Consultar →</span></button>
      <button class="home-card" data-go="works"><span class="home-icon">⌖</span><h3>Obras e mapa</h3><p>Visualize as três localizações, interaja no mapa e encontre patrimônio ou pedidos por obra.</p><span class="go">Abrir mapa →</span></button>
      <button class="home-card" data-go="guide"><span class="home-icon">▤</span><h3>Guia de patrimônios</h3><p>Consulte a relação dos patrimônios com as colunas nomeadas para uso operacional e exportação.</p><span class="go">Abrir guia →</span></button>
      <button class="home-card" data-go="settings"><span class="home-icon">⚙</span><h3>Configuração</h3><p>Ajuste somente o necessário para esta demonstração e veja como o projeto poderá evoluir futuramente.</p><span class="go">Abrir configuração →</span></button>

    <div class="grid grid-2" style="margin-top:12px;height:calc(100% - 302px)">
      <div class="panel pad" style="min-height:0;display:flex;flex-direction:column"><div class="panel-head"><div><div class="panel-title">Últimas solicitações</div><div class="panel-sub">Pedidos registrados por obra e data.</div></div><button class="btn small" data-go="requests">Ver todas</button></div><div class="scroll" style="min-height:0">${state.requests.slice(0,5).map(r=>requestRow(r)).join('')}</div></div>
      <div class="panel pad" style="min-height:0;display:flex;flex-direction:column"><div class="panel-head"><div><div class="panel-title">Últimas movimentações</div><div class="panel-sub">Registro em memória desta sessão.</div></div><button class="btn small" data-go="assets">Patrimônios</button></div><div class="scroll" style="min-height:0">${state.movements.length?state.movements.slice(0,7).map(m=>movementRow(m)).join(''):'<div class="empty">Nenhuma movimentação registrada nesta sessão.</div>'}</div></div>
    </div>
  </div>`;
}
function requestRow(r){const p=Math.round(stepsDone(r)/6*100),work=locationBy(r.workId);return `<div class="list-row"><div class="grow"><div class="row-title">#${esc(r.number)} · ${esc(work?.name||'Obra')}</div><div class="row-sub">${fmtDate(r.date)} · ${esc(r.reason)}</div><div class="bar"><span style="width:${p}%"></span></div></div><span class="badge ${stepsDone(r)<6?'orange':'blue'}">${stepsDone(r)}/6</span></div>`}
function movementRow(m){return `<div class="list-row"><div class="grow"><div class="row-title">${esc(m.code)} · ${esc(m.name)}</div><div class="row-sub">${esc(m.action)} · ${fmtDateTime(m.at)}</div></div><span class="badge blue">registrado</span></div>`}

/* =========================================================
   ASSETS
   ========================================================= */
function assetsPage(){
  const q=state.globalQuery.trim().toLowerCase();
  const list=state.assets.filter(a=>!q||[a.code,a.name,a.category,locationBy(a.locationId)?.name].join(' ').toLowerCase().includes(q));
  return `<div class="page-inner asset-layout">
    <div><div class="page-head"><div><h1>Patrimônios</h1><p>Consulta operacional do patrimônio serializado. Use a pesquisa superior ou o filtro desta área para localizar um item.</p></div><div class="head-actions"><button class="btn primary" id="newAsset">+ Novo patrimônio</button></div></div>
    <div class="panel pad"><div class="asset-toolbar"><input class="input" id="assetSearch" value="${esc(q)}" placeholder="Pesquisar por número, nome, categoria ou obra..."><select class="select" id="assetWork" style="max-width:220px"><option value="">Todas as localizações</option>${state.locations.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div></div></div>
    <div class="asset-table"><div class="table-wrap"><table><thead><tr><th>Número de patrimônio</th><th>Nome do item</th><th>Categoria</th><th>Localização</th><th>Status</th><th></th></tr></thead><tbody>${list.length?list.map(a=>`<tr><td class="code">${esc(a.code)}</td><td>${esc(a.name)}</td><td class="muted">${esc(a.category)}</td><td>${esc(locationBy(a.locationId)?.name||'—')}</td><td><span class="badge blue">Disponível</span></td><td><button class="btn small" data-open-asset="${a.id}">Ver</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">Nenhum patrimônio encontrado.</div></td></tr>`}</tbody></table></div></div>
  </div>`;
}
function openAsset(id){const a=state.assets.find(x=>x.id===id);if(!a)return;state.selectedWork=a.locationId;notify(`${a.code} selecionado`);render();}

/* =========================================================
   READER
   ========================================================= */
function readerPage(){
  const s=state.activeSession;
  return `<div class="page-inner reader-layout">
    <div class="reader-left">
      <div class="panel pad scan-panel">
        <div class="panel-head"><div><div class="panel-title">Leitor de patrimônio</div><div class="panel-sub">A câmera usa a lente traseira quando disponível. Leia texto por OCR, escaneie códigos de barras em tempo real ou consulte digitando o número patrimonial. As consultas são executadas localmente na base importada.</div></div><span class="badge ${s?'orange':'neutral'}">${s?'Pasta aberta':'Pronto para iniciar'}</span></div>
        <div class="camera-shell" id="cameraShell"><div class="camera-placeholder" id="cameraPlaceholder"><div><div style="font:700 42px 'Space Grotesk';color:var(--blue);margin-bottom:6px">◫</div><div style="font-weight:700;color:var(--text);font-size:12px">Inicie uma pasta para ativar a câmera</div><div style="font-size:9.5px;margin-top:4px">Permita o acesso à câmera quando o navegador solicitar. Prefira HTTPS ou localhost.</div></div></div><video id="camera" autoplay playsinline muted style="display:none"></video><div class="finder" id="finder" style="display:none"></div></div>
        <div class="reader-actions">
          ${s?`<button class="btn" id="cameraStartBtn">↻ Reativar câmera</button><button class="btn primary" id="captureAndProcess">◎ Capturar e processar</button><button class="btn" id="finishSession">Finalizar pasta</button><button class="btn" id="capturePhoto">Fotografar</button><button class="btn ${state.barcodeScanActive?'primary':''}" id="scanAgain">${state.barcodeScanActive?'Parar leitura de código':'Ler código de barras'}</button><button class="btn" id="editSession">Editar pasta</button>`:`<button class="btn primary" id="startSession">Ativar câmera e iniciar leitura</button><button class="btn" id="manualSession">Criar pasta manual</button>`}
          ${s?`<label class="btn file-input-label">Adicionar fotos<input type="file" accept="image/*" multiple id="addSessionPhotos"></label>`:''}
        </div>
        <div class="manual-code-lookup"><label for="manualAssetLookup">Consultar por número do patrimônio ou código de barras</label><div class="lookup-row"><input id="manualAssetLookup" type="search" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="Digite ou cole o número / código de barras" value="${esc(state.lookupQuery||'')}"><button class="btn" id="manualAssetLookupBtn">Consultar</button></div><div class="lookup-help">A leitura de barras e a consulta digitada pesquisam a mesma base importada. Os resultados aparecem abaixo e podem ser adicionados à pasta atual.</div></div>
        <div class="ocr-results" id="ocrResult">${renderOCRResultHTML(state.lastOCR)}</div>
      </div>
      <div class="panel pad" style="min-height:110px"><div class="panel-head"><div><div class="panel-title">OCR por arquivo</div><div class="panel-sub">Também é possível selecionar uma foto já existente. A imagem é processada neste dispositivo, desde que a biblioteca esteja carregada.</div></div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><label class="btn file-input-label">Selecionar foto<input type="file" accept="image/*" id="ocrInput" multiple></label><button class="btn" id="addManualAsset">Adicionar patrimônio manualmente</button></div></div>
    </div>
    <div class="reader-right">
      <div class="panel pad session-panel" style="height:42%"><div class="panel-head"><div><div class="panel-title">Pasta atual</div><div class="panel-sub">Fotos e patrimônios da leitura.</div></div></div>${s?sessionDetail(s):'<div class="empty">Nenhuma pasta aberta.</div>'}</div>
      <div class="panel pad session-panel" style="height:58%"><div class="panel-head"><div><div class="panel-title">Histórico de pastas</div><div class="panel-sub">Pastas finalizadas podem ser editadas posteriormente.</div></div></div><div class="session-list">${state.readerSessions.length?state.readerSessions.slice().reverse().map(sessionCard).join(''):'<div class="empty">Nenhuma pasta finalizada nesta sessão.</div>'}</div></div>
    </div>
  </div>`;
}
function sessionDetail(s){return `<div class="row-title">${esc(s.title)}</div><div class="row-sub">${fmtDateTime(s.createdAt)} · ${s.finished?'Finalizada':'Aberta'}</div><div class="photo-grid">${s.photos.map((p,i)=>`<div class="photo"><img src="${p.data}" alt="Foto ${i+1}">${((state.activeSession&&state.activeSession.id===s.id)||s.finished===false)?`<button data-remove-photo="${i}" title="Remover">×</button>`:''}</div>`).join('')||'<div class="empty" style="grid-column:1/-1">Nenhuma foto ainda.</div>'}</div><div style="margin-top:8px;max-height:96px;overflow:auto">${s.assetCodes.map(c=>`<div class="list-row"><span class="code">${esc(c)}</span><span class="muted" style="margin-left:auto;font-size:8px">Patrimônio</span></div>`).join('')||'<div class="empty">Nenhum patrimônio identificado.</div>'}</div>`}
function sessionCard(s){return `<div class="session-card"><div class="request-top"><div><div class="row-title">${esc(s.title)}</div><div class="row-sub">${fmtDateTime(s.createdAt)} · ${s.assetCodes.length} item(ns) · ${s.photos.length} foto(s)</div></div><span class="badge blue">${s.finished?'finalizada':'aberta'}</span></div><div style="display:flex;gap:7px;margin-top:8px"><button class="btn small" data-edit-session="${s.id}">Editar</button><button class="btn small" data-link-request="${s.id}">Vincular pedido</button></div></div>`}
function startSession(){const id='rs'+Date.now(),r=state.selectedRequest?requestBy(state.selectedRequest):null,work=r?locationBy(r.workId):null;state.activeSession={id,title:r?`Pedido #${r.number} · ${work?.name||'Obra'}`:`Pasta de leitura ${new Date().toLocaleDateString('pt-BR')} · ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`,createdAt:new Date().toISOString(),finished:false,editing:false,photos:[],assetCodes:[],requestId:r?.id||null};logAudit('criou pasta','readerSession',id);render();startCamera();}
function finishSession(){if(!state.activeSession)return;const wasEditing=!!state.activeSession.editing;const done={...state.activeSession,finished:true,editing:false,photos:[...state.activeSession.photos],assetCodes:[...state.activeSession.assetCodes]};const idx=state.readerSessions.findIndex(x=>x.id===done.id);if(idx>=0)state.readerSessions[idx]=done;else state.readerSessions.push(done);logAudit(wasEditing?'atualizou pasta':'finalizou pasta','readerSession',done.id);state.activeSession=null;stopScanner();notify(wasEditing?'Alterações salvas':'Pasta finalizada');render();}
function editSession(id){const s=state.readerSessions.find(x=>x.id===id);if(!s)return;state.activeSession={...s,photos:[...s.photos],assetCodes:[...s.assetCodes],finished:false,editing:true};notify('Pasta reaberta para edição');render();}
function addPhotoToSession(data){if(!state.activeSession)return;state.activeSession.photos.push({id:'ph'+Date.now()+Math.random().toString(16).slice(2),data});render();}
/* =========================================================
   CÂMERA + OCR + CONSULTA À BASE EXCEL
   - A câmera precisa de permissão e, em celulares modernos, HTTPS/localhost.
   - O frame é processado localmente por Tesseract.js; não é enviado a uma API.
   - A base Excel importada é consultada a partir do JSON guardado no navegador.
   ========================================================= */
function normalizeText(value){
  return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
}
function getOCRCandidates(text){
  const matches=String(text||'').toUpperCase().match(/[A-Z0-9][A-Z0-9._\/-]{1,}/g)||[];
  const seen=new Set();
  return matches.map(x=>x.trim()).filter(x=>{const n=normalizeText(x);if(n.length<3||!/[0-9]/.test(n)||seen.has(n))return false;seen.add(n);return true;});
}
function isIdentifierHeader(header){
  const h=normalizeHeader(header);
  return /(patrimonio|patrimonial|tombamento|plaqueta|etiqueta|codig|barcode|barras|ean|upc|gtin|^tag$|identificacao|^numero$|^num$|number)/.test(h);
}
function excelIdentifierValues(row){
  const candidates=[
    {value:row.__number,label:'Número do patrimônio'},
    {value:row.__barcode,label:'Código de barras'},
    {value:row.__code,label:'Código principal'}
  ];
  for(const [key,value] of Object.entries(row.__raw||{})){
    if(isIdentifierHeader(key))candidates.push({value,label:key});
  }
  const seen=new Set();
  return candidates.filter(item=>{
    const value=String(item.value??'').trim(),norm=normalizeText(value);
    if(!norm||seen.has(norm))return false;
    seen.add(norm);item.value=value;return true;
  });
}
function lookupCodeMatches(rawValue,options={}){
  const query=String(rawValue??'').trim(),norm=normalizeText(query);
  if(!norm)return [];
  const found=[];
  for(const row of state.excelRecords){
    const identifiers=excelIdentifierValues(row);
    const hit=identifiers.find(item=>normalizeText(item.value)===norm);
    const contained=options.fullText?identifiers.find(item=>{
      const v=normalizeText(item.value);return v.length>=5&&normalizeText(options.fullText).includes(v);
    }):null;
    const match=hit||contained;
    if(match){
      found.push({source:'Base Excel importada',code:String(row.__number||row.__code||row.__barcode||match.value||query),matchedValue:match.value,matchedField:match.label,record:row.__raw||{},mapped:row});
    }
  }
  for(const asset of state.assets){
    const identifiers=[asset.code,asset.barcode,asset.number].filter(x=>String(x??'').trim());
    const hit=identifiers.find(value=>normalizeText(value)===norm);
    const contained=options.fullText?identifiers.find(value=>{const v=normalizeText(value);return v.length>=5&&normalizeText(options.fullText).includes(v);}):null;
    const match=hit||contained;
    if(match&&!found.some(x=>normalizeText(x.code)===normalizeText(asset.code))){
      found.push({source:'Patrimônios desta demonstração',code:asset.code||String(match),matchedValue:String(match),matchedField:'Código / número',record:{'Código do patrimônio':asset.code||'—','Nome do item':asset.name,'Categoria':asset.category,'Localização':locationBy(asset.locationId)?.name||'—','Status':asset.status||'—'},mapped:null});
    }
  }
  return found.slice(0,8);
}
function lookupOCRMatches(text){
  const candidates=getOCRCandidates(text),found=[],seen=new Set();
  for(const candidate of candidates){
    for(const match of lookupCodeMatches(candidate)){
      const key=`${match.source}|${normalizeText(match.code)}|${normalizeText(match.matchedValue)}`;
      if(!seen.has(key)){seen.add(key);found.push(match);}
    }
  }
  // Recupera identificadores longos que apareçam unidos a outros caracteres no texto OCR.
  for(const row of state.excelRecords){
    const full=normalizeText(text),hit=excelIdentifierValues(row).find(item=>{const v=normalizeText(item.value);return v.length>=5&&full.includes(v);});
    if(hit){
      const match={source:'Base Excel importada',code:String(row.__number||row.__code||row.__barcode||hit.value),matchedValue:hit.value,matchedField:hit.label,record:row.__raw||{},mapped:row};
      const key=`${match.source}|${normalizeText(match.code)}|${normalizeText(match.matchedValue)}`;if(!seen.has(key)){seen.add(key);found.push(match);}
    }
  }
  return found.slice(0,8);
}
function performCodeLookup(rawValue,mode='manual',format=''){
  const value=String(rawValue??'').trim();
  if(!value){notify('Digite um número ou código de barras para consultar.');return null;}
  state.lookupQuery=value;
  const matches=lookupCodeMatches(value);
  const candidates=[value];
  state.lastOCR={status:'done',mode,text:value,matches,candidates,format,confidence:null,at:new Date().toISOString()};
  if(state.activeSession){
    const values=new Set([value,...matches.map(m=>String(m.code||'').trim())].filter(Boolean).map(v=>v.toUpperCase()));
    for(const code of values)if(!state.activeSession.assetCodes.includes(code))state.activeSession.assetCodes.push(code);
  }
  if(state.view==='reader')keepCameraAfterRender();else updateOCRResult();
  if(matches.length)notify(`${matches.length} correspondência(s) para ${value}`);
  else notify(`Código ${value} consultado; nenhum registro correspondente.`);
  return state.lastOCR;
}
function manualLookup(){const input=$('manualAssetLookup');if(!input)return;performCodeLookup(input.value,'manual');}
function handleDetectedBarcode(value,format=''){
  const v=String(value??'').trim();
  if(!v)return;
  state.barcodeScanActive=false;
  if(state.scannerTimer){clearTimeout(state.scannerTimer);state.scannerTimer=null;}
  state.barcodeEngine='';
  performCodeLookup(v,'barcode',format);
}
function renderOCRResultHTML(result){
  if(!result)return '<div class="ocr-status">Aponte a câmera para uma etiqueta, mantenha o código enquadrado e toque em <strong>Capturar e processar</strong>. O resultado e as correspondências aparecerão aqui.</div>';
  if(result.status==='processing')return `<div class="ocr-title">Processando imagem</div><div class="ocr-status">${esc(result.message||'O OCR está lendo a imagem no próprio navegador. Em celulares, a primeira leitura pode demorar enquanto os modelos são carregados.')}</div><progress max="100" value="${Math.max(0,Math.min(100,Number(result.progress)||0))}"></progress>`;
  if(result.status==='scanningBarcode')return `<div class="ocr-title">Leitura de código de barras ativa</div><div class="ocr-status">${esc(result.message||'Mantenha o código de barras enquadrado. A leitura será consultada automaticamente na base importada.')}</div>`;
  if(result.status==='cancelled')return `<div class="ocr-title">Leitura pausada</div><div class="ocr-status">${esc(result.message||'A leitura de código de barras foi interrompida.')}</div>`;
  if(result.status==='error')return `<div class="ocr-title">Não foi possível concluir o OCR</div><div class="ocr-status">${esc(result.error||'Verifique a conexão para carregar a biblioteca/modelos e tente novamente.')}</div>`;
  const matches=result.matches||[];
  const cards=matches.length?matches.map(m=>{
    const fields=Object.entries(m.record||{}).filter(([k,v])=>v!==''&&v!==null&&v!==undefined&&!k.startsWith('__')).slice(0,14);
    return `<div class="ocr-match"><div class="ocr-match-head"><strong class="code">${esc(m.code||'Código não identificado')}</strong><span class="badge blue">${esc(m.source)}</span></div>${fields.map(([k,v])=>`<div class="ocr-field"><span>${esc(k)}</span><strong>${esc(String(v))}</strong></div>`).join('')||'<div class="ocr-status">Correspondência encontrada, mas sem outros campos preenchidos.</div>'}</div>`;
  }).join(''):`<div class="notice" style="margin-top:8px">${result.mode==='barcode'||result.mode==='manual'?'Nenhum código correspondente foi encontrado. Confira os dígitos ou importe/valide a planilha em Configuração.':'Nenhum código da leitura correspondeu à base importada ou aos patrimônios de demonstração. Confira o texto abaixo ou importe uma planilha em Configuração.'}</div>`;
  const candidates=result.candidates||[];
  const title=result.mode==='barcode'?'Código de barras reconhecido':result.mode==='manual'?'Consulta por número / código':'Texto reconhecido pelo OCR';
  const lead=matches.length?`${matches.length} correspondência(s) encontrada(s).`:result.mode==='manual'||result.mode==='barcode'?'Nenhum registro exato correspondente foi encontrado. Confira os dígitos e a base importada.':'Leitura concluída; nenhuma correspondência exata encontrada.';
  const extra=result.mode==='barcode'&&result.format?` · Formato detectado: ${esc(result.format)}`:'';
  return `<div class="ocr-title">${title}</div><div class="ocr-status">${lead}${extra}${state.excelRecords.length?` Base Excel: ${state.excelRecords.length.toLocaleString('pt-BR')} registro(s).`:' Base Excel ainda não importada.'}</div>${candidates.length?`<div class="excel-meta">${candidates.slice(0,8).map(c=>`<span class="badge neutral">${esc(c)}</span>`).join('')}</div>`:''}<pre class="ocr-text">${esc(result.text||'(nenhum texto reconhecido)')}</pre>${cards}`;
}
function updateOCRResult(){const node=$('ocrResult');if(node)node.innerHTML=renderOCRResultHTML(state.lastOCR);}
function keepCameraAfterRender(){
  const stream=state.scannerStream;
  render();
  if(stream&&state.view==='reader'){
    const video=$('camera'),placeholder=$('cameraPlaceholder'),finder=$('finder');
    if(video){video.srcObject=stream;video.style.display='block';video.setAttribute('autoplay','');video.play().catch(()=>{});}
    if(placeholder)placeholder.style.display='none';
    if(finder)finder.style.display='block';

async function processOCRSource(source,options={}){
  if(!source)return;
  if(!window.Tesseract||typeof Tesseract.recognize!=='function'){
    state.lastOCR={status:'error',error:'A biblioteca Tesseract.js não carregou. Verifique a conexão com a internet e recarregue o HTML.'};updateOCRResult();return;
  }
  state.ocrBusy=true;
  state.lastOCR={status:'processing',message:'Preparando o reconhecimento local…',progress:0};updateOCRResult();
  let result;
  const logger=m=>{
    if(!m||state.lastOCR?.status!=='processing')return;
    const p=Number.isFinite(m.progress)?Math.round(m.progress*100):0;
    state.lastOCR.progress=p;
    state.lastOCR.message=m.status?`${m.status}${Number.isFinite(m.progress)?` · ${p}%`:''}`:'Lendo a imagem…';
    updateOCRResult();
  };
  try{
    try{result=await Tesseract.recognize(source,'por+eng',{logger});}
    catch(languageError){result=await Tesseract.recognize(source,'eng',{logger});}
    const text=String(result?.data?.text||'').trim();
    const matches=lookupOCRMatches(text);
    const candidates=getOCRCandidates(text);
    state.lastOCR={status:'done',text,matches,candidates,confidence:Number(result?.data?.confidence)||null,at:new Date().toISOString()};
    if(state.activeSession){
      const codes=matches.map(m=>String(m.code||'').trim().toUpperCase()).filter(Boolean);
      const chosen=codes.length?codes:candidates.slice(0,1).map(x=>x.toUpperCase());
      for(const code of chosen)if(!state.activeSession.assetCodes.includes(code))state.activeSession.assetCodes.push(code);
      if(options.photoData)state.activeSession.photos.push({id:'ph'+Date.now()+Math.random().toString(16).slice(2),data:options.photoData});
    }
    state.ocrBusy=false;
    if(state.view==='reader')keepCameraAfterRender();else updateOCRResult();
    notify(matches.length?`OCR concluído: ${matches.length} correspondência(s)`:(text?'OCR concluído; confira o texto':'Nenhum texto reconhecido'));
    return state.lastOCR;
  }catch(err){
    state.ocrBusy=false;
    state.lastOCR={status:'error',error:`${err?.message||'Erro desconhecido'}. Verifique a conexão, a permissão de uso de memória e tente uma imagem mais nítida.`};
    if(state.view==='reader')keepCameraAfterRender();else updateOCRResult();
    notify('Falha ao processar OCR');
    return state.lastOCR;
  }
}
function createCameraFrame(){
  const video=$('camera');
  if(!video||!state.scannerStream){notify('Ative a câmera iniciando uma pasta de leitura.');return null;}
  if(video.readyState<2||!video.videoWidth||!video.videoHeight){notify('A câmera ainda está inicializando. Tente novamente em alguns segundos.');return null;}
  const scale=Math.min(1,1600/video.videoWidth);
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  if(!ctx){notify('Não foi possível preparar a imagem');return null;}
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  return canvas;
}
function capturePhotoOnly(){
  const canvas=createCameraFrame();if(!canvas)return;
  if(!state.activeSession){notify('Inicie uma pasta antes de fotografar.');return;}
  try{state.activeSession.photos.push({id:'ph'+Date.now()+Math.random().toString(16).slice(2),data:canvas.toDataURL('image/jpeg',0.86)});keepCameraAfterRender();notify('Foto anexada à pasta.');}
  catch(_){notify('Não foi possível salvar a foto na pasta.');}
}
async function captureAndProcess(){
  const canvas=createCameraFrame();if(!canvas)return;
  let photoData='';try{photoData=canvas.toDataURL('image/jpeg',0.86)}catch(_){ }
  await processOCRSource(canvas,{photoData});
}
function readFileAsDataURL(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Falha ao ler o arquivo de imagem.'));reader.readAsDataURL(file);});}
async function processOCR(file){if(!file)return;try{const imageData=await readFileAsDataURL(file);await processOCRSource(imageData);}catch(err){state.lastOCR={status:'error',error:err?.message||'Não foi possível abrir a imagem.'};updateOCRResult();}}
async function handlePhotoFiles(files){for(const f of Array.from(files||[])){if(!f.type.startsWith('image/'))continue;try{const data=await readFileAsDataURL(f);if(state.activeSession)state.activeSession.photos.push({id:'ph'+Date.now()+Math.random().toString(16).slice(2),data});}catch(_){notify('Não foi possível adicionar uma das fotos');}}if(state.view==='reader')keepCameraAfterRender();}
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){notify('A câmera exige navegador compatível e contexto seguro (HTTPS ou localhost).');return;}
  const video=$('camera'),ph=$('cameraPlaceholder'),finder=$('finder');
  if(!video){notify('Abra a aba Leitor antes de ativar a câmera.');return;}
  if(state.scannerStream){state.scannerStream.getTracks().forEach(t=>t.stop());state.scannerStream=null;}
  try{
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});}
    catch(_){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});}
    state.scannerStream=stream;video.srcObject=stream;video.style.display='block';video.setAttribute('autoplay','');if(ph)ph.style.display='none';if(finder)finder.style.display='block';await video.play();
  }catch(err){state.scannerStream=null;notify(err?.name==='NotAllowedError'?'Permissão de câmera negada. Autorize o acesso nas configurações do navegador.':'Não foi possível abrir a câmera traseira neste dispositivo.');}
}
function stopScanner(){state.barcodeScanActive=false;if(state.scannerTimer){clearTimeout(state.scannerTimer);state.scannerTimer=null;}state.barcodeEngine='';if(state.scannerStream){state.scannerStream.getTracks().forEach(t=>t.stop());state.scannerStream=null;}const v=$('camera');if(v){v.pause?.();v.srcObject=null;v.style.display='none';}const f=$('finder');if(f)f.style.display='none';const p=$('cameraPlaceholder');if(p)p.style.display='grid';}
function addNewAsset(){const code=prompt('Número de patrimônio:');if(!code)return;const name=prompt('Nome do item:');if(!name)return;const category=prompt('Categoria:')||'Não informado';state.assets.unshift({id:'a'+Date.now(),code:code.trim().toUpperCase(),name:name.trim(),category,locationId:'obra126',status:'available'});logAudit('criou patrimônio','asset',state.assets[0].id);notify('Patrimônio adicionado');render();}
async function scanBarcode(){
  const video=$('camera');
  if(state.barcodeScanActive){
    state.barcodeScanActive=false;
    if(state.scannerTimer){clearTimeout(state.scannerTimer);state.scannerTimer=null;}
    state.barcodeEngine='';
    const btn=$('scanAgain');if(btn)btn.textContent='Ler código de barras';
    state.lastOCR={status:'cancelled',mode:'barcode',message:'A leitura de código de barras foi interrompida. Toque em “Ler código de barras” para continuar.',at:new Date().toISOString()};
    updateOCRResult();notify('Leitura de código de barras pausada');return;
  }
  if(!video||!state.scannerStream){notify('Inicie uma pasta e ative a câmera para ler o código de barras.');return;}
  if(video.readyState<2||!video.videoWidth||!video.videoHeight){notify('A câmera ainda está inicializando. Tente novamente em alguns segundos.');return;}

  let detector=null;
  if('BarcodeDetector' in window){
    try{
      const wanted=['code_128','code_39','code_93','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix','pdf417'];
      let formats=wanted;
      if(typeof BarcodeDetector.getSupportedFormats==='function'){
        const supported=await BarcodeDetector.getSupportedFormats();
        formats=wanted.filter(f=>supported.includes(f));
      }
      if(formats.length)detector=new BarcodeDetector({formats});
    }catch(_){detector=null;}
  }
  const zxingAvailable=!!(window.ZXingBrowser&&typeof window.ZXingBrowser.BrowserMultiFormatReader==='function');
  if(!detector&&!zxingAvailable){
    state.lastOCR={status:'error',error:'Este navegador não oferece BarcodeDetector e a biblioteca ZXing não carregou. Verifique a internet ou use a consulta digitada logo abaixo.'};updateOCRResult();notify('Leitor de barras indisponível; use a consulta manual.');return;
  }

  const canvas=document.createElement('canvas');
  const scale=Math.min(1,1280/Math.max(video.videoWidth,video.videoHeight));
  canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  if(!ctx){notify('Não foi possível preparar o leitor de barras.');return;}
  const zxing=(!detector&&zxingAvailable)?new window.ZXingBrowser.BrowserMultiFormatReader():null;
  state.barcodeScanActive=true;state.barcodeEngine=detector?'BarcodeDetector':'ZXing';
  state.lastOCR={status:'scanningBarcode',message:`Leitor ativo via ${state.barcodeEngine}. Aponte a câmera para o código de barras e mantenha o enquadramento firme.`};
  const button=$('scanAgain');if(button){button.textContent='Parar leitura de código';button.classList.add('primary');}
  updateOCRResult();

  const loop=async()=>{
    if(!state.barcodeScanActive||!state.scannerStream||state.view!=='reader')return;
    try{
      if(video.readyState>=2&&video.videoWidth&&video.videoHeight){
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        if(detector){
          const codes=await detector.detect(canvas);
          if(codes&&codes.length){
            const hit=codes.find(c=>String(c.rawValue||'').trim());
            if(hit){handleDetectedBarcode(hit.rawValue,hit.format||'');return;}
          }
        }else if(zxing){
          try{
            const result=await zxing.decodeFromCanvas(canvas);
            const value=result?.getText?.()||result?.text||'';
            if(String(value).trim()){handleDetectedBarcode(value,result?.getBarcodeFormat?.()?.toString?.()||'ZXing');return;}
          }catch(_){/* Sem código neste frame; continua a varredura. */}
        }
      }
    }catch(_){/* Falha transitória de um frame; continua tentando. */}
    if(state.barcodeScanActive)state.scannerTimer=setTimeout(loop,detector?180:360);
  };
  loop();
}

/* =========================================================
   IMPORTAÇÃO EXCEL/CSV E PERSISTÊNCIA LOCAL
   A planilha é lida pelo SheetJS no cliente e guardada como JSON no IndexedDB.
   localStorage é fallback quando IndexedDB não estiver disponível.
   ========================================================= */
const EXCEL_DB_NAME='leitor-patrimonio-local-v1';
const EXCEL_DB_STORE='app-data';
const EXCEL_LS_KEY='leitorPatrimonio.importedExcelBase.v1';
function openExcelDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(new Error('IndexedDB indisponível'));return;}
    const request=indexedDB.open(EXCEL_DB_NAME,1);
    request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(EXCEL_DB_STORE))db.createObjectStore(EXCEL_DB_STORE,{keyPath:'key'});};
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('Não foi possível abrir IndexedDB'));
    request.onblocked=()=>reject(new Error('O banco local está bloqueado por outra aba. Feche outras abas do app e tente novamente.'));
  });
}
async function saveExcelPayload(payload){
  try{
    const db=await openExcelDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(EXCEL_DB_STORE,'readwrite');
      tx.objectStore(EXCEL_DB_STORE).put({key:'imported-base',...payload});
      tx.oncomplete=()=>{db.close();resolve();};
      tx.onerror=()=>{const err=tx.error||new Error('Falha ao salvar base Excel');db.close();reject(err);};
      tx.onabort=()=>{const err=tx.error||new Error('Gravação local cancelada');db.close();reject(err);};
    });
    return 'IndexedDB';
  }catch(idbError){
    try{localStorage.setItem(EXCEL_LS_KEY,JSON.stringify(payload));return 'localStorage';}
    catch(lsError){throw new Error('Não foi possível persistir a planilha. IndexedDB: '+(idbError.message||'indisponível')+'; localStorage: '+(lsError.message||'quota ou bloqueio do navegador'));}
  }
}
async function loadExcelPayload(){
  try{
    const db=await openExcelDB();
    const value=await new Promise((resolve,reject)=>{
      const tx=db.transaction(EXCEL_DB_STORE,'readonly');const req=tx.objectStore(EXCEL_DB_STORE).get('imported-base');
      req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('Falha ao ler a base local'));
      tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error||new Error('Falha na leitura local'));};
    });
    if(value)return {payload:value,storage:'IndexedDB'};
  }catch(_){/* tenta o fallback logo abaixo */}
  try{const raw=localStorage.getItem(EXCEL_LS_KEY);if(raw)return {payload:JSON.parse(raw),storage:'localStorage'};}catch(_){ }
  return null;
}
function normalizeHeader(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function findColumn(keys,needles){
  for(const needle of needles){const hit=keys.find(k=>normalizeHeader(k)===needle)||keys.find(k=>normalizeHeader(k).includes(needle));if(hit)return hit;}
  return '';
}
function mapExcelRows(rows){
  if(!Array.isArray(rows)||!rows.length)throw new Error('A primeira aba da planilha não contém linhas de dados.');
  const keys=Object.keys(rows.find(r=>r&&typeof r==='object')||{});
  if(!keys.length)throw new Error('Não foi possível identificar os cabeçalhos da planilha. A primeira linha deve conter os nomes das colunas.');
  const numberKey=findColumn(keys,['numeropatrimonio','numpatrimonio','numeropatrimonial','numpatrimonial','numerodepatrimonio','numerodobem','numdobem','numerotombamento','numtombamento','tombamento','plaqueta','identificacaopatrimonio','idpatrimonio'])||keys.find(k=>['numero','num','number'].includes(normalizeHeader(k)))||'';
  const barcodeKey=findColumn(keys,['codigodebarras','codigodebarra','codbarras','codbarr','barcode','barras','ean13','ean8','gtin','upca','upce']);
  const genericCodeKey=findColumn(keys,['codigopatrimonio','codpatrimonio','patrimoniocodigo','codigodobem','codigobem','codigo','cod','tag','identificacao','idpatrimonio']);
  const codeKey=numberKey||genericCodeKey||barcodeKey||keys[0];
  const nameKey=findColumn(keys,['nomedoitem','descricaodoitem','descricao','nome','equipamento','material','produto','bem','item']);
  const categoryKey=findColumn(keys,['categoria','grupo','familia','tipo']);
  const locationKey=findColumn(keys,['localizacao','local','obra','unidade','destino','almoxarifado','centrodecusto']);
  const statusKey=findColumn(keys,['status','situacao','condicao','estado']);
  const records=rows.filter(r=>r&&Object.values(r).some(v=>String(v??'').trim()!=='')).map((raw,index)=>({
    __id:`excel-${index+1}`,
    __code:String(raw[codeKey]??'').trim(),
    __number:numberKey?String(raw[numberKey]??'').trim():'',
    __barcode:barcodeKey?String(raw[barcodeKey]??'').trim():'',
    __name:nameKey?String(raw[nameKey]??'').trim():'',
    __category:categoryKey?String(raw[categoryKey]??'').trim():'',
    __location:locationKey?String(raw[locationKey]??'').trim():'',
    __status:statusKey?String(raw[statusKey]??'').trim():'',
    __raw:Object.fromEntries(Object.entries(raw).map(([k,v])=>[String(k),v==null?'':String(v)]))
  }));
  return {records,columns:{code:codeKey,number:numberKey||'—',barcode:barcodeKey||'—',name:nameKey||'—',category:categoryKey||'—',location:locationKey||'—',status:statusKey||'—'}};
}
async function importExcelFile(file){
  if(!file)return;
  if(!window.XLSX||typeof XLSX.read!=='function'){notify('A biblioteca SheetJS não carregou. Verifique a internet e recarregue a página.');return;}
  const status=$('excelImportStatus');if(status)status.textContent='Lendo e estruturando a planilha…';
  try{
    const bytes=await file.arrayBuffer();
    const workbook=XLSX.read(bytes,{type:'array',cellDates:false,raw:false});
    const sheetName=workbook.SheetNames?.[0];if(!sheetName)throw new Error('O arquivo não contém abas legíveis.');
    const worksheet=workbook.Sheets[sheetName];
    const rows=XLSX.utils.sheet_to_json(worksheet,{defval:'',raw:false});
    const mapped=mapExcelRows(rows);
    const payload={records:mapped.records,meta:{fileName:file.name,sheetName,rows:mapped.records.length,columns:mapped.columns,importedAt:new Date().toISOString(),fileSize:file.size}};
    state.excelStorage=await saveExcelPayload(payload);state.excelRecords=payload.records;state.excelMeta=payload.meta;
    logAudit('importou base Excel','excelBase',file.name);
    if(status)status.textContent=`Importação concluída: ${payload.records.length.toLocaleString('pt-BR')} registro(s) salvos em ${state.excelStorage}.`;
    notify(`Base importada: ${payload.records.length.toLocaleString('pt-BR')} registro(s)`);
    if(state.view==='settings')render();
  }catch(err){if(status)status.textContent=`Falha na importação: ${err.message||'erro não identificado'}`;notify('Não foi possível importar a planilha');}
}
async function restoreExcelBase(){
  const saved=await loadExcelPayload();
  if(saved?.payload?.records&&Array.isArray(saved.payload.records)){
    state.excelRecords=saved.payload.records;state.excelMeta=saved.payload.meta||null;state.excelStorage=saved.storage;
    if(['settings','reader'].includes(state.view))keepCameraAfterRender();
  }
}
function excelPreviewHTML(){
  if(!state.excelRecords.length)return '<div class="empty">Nenhuma planilha importada. Selecione um arquivo Excel ou CSV acima.</div>';
  const keys=Object.keys(state.excelRecords[0].__raw||{}).slice(0,6);

}

    <div class="panel pad excel-panel"><div class="panel-head"><div><div class="panel-title">Base de dados patrimonial · Excel / CSV</div><div class="panel-sub">Importe uma planilha cuja primeira linha tenha os cabeçalhos. A base estruturada será salva em JSON no IndexedDB; se indisponível, o app tentará o localStorage.</div></div><span class="badge ${state.excelRecords.length?'blue':'neutral'}">${state.excelRecords.length?`${state.excelRecords.length.toLocaleString('pt-BR')} registros`:'Sem planilha'}</span></div>
      <div class="excel-actions"><label class="btn primary file-input-label">Selecionar arquivo Excel ou CSV<input type="file" id="excelFile" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"></label><span class="panel-sub">Formatos aceitos: .xlsx, .xls e .csv. O processamento ocorre localmente no navegador.</span></div>
      <div id="excelImportStatus" class="ocr-status" role="status" aria-live="polite" style="margin-top:9px">${state.excelMeta?`Última importação: ${esc(meta.fileName||'arquivo')} · ${state.excelRecords.length.toLocaleString('pt-BR')} registro(s) · armazenamento: ${esc(state.excelStorage||'local')}${importedAt?` · ${esc(importedAt)}`:''}`:'Nenhuma importação registrada.'}</div>
      ${meta?`<div class="excel-meta"><span class="badge blue">Aba: ${esc(meta.sheetName||'')}</span><span class="badge neutral">Código: ${esc(cols.code||'—')}</span><span class="badge neutral">Nome: ${esc(cols.name||'—')}</span><span class="badge neutral">Categoria: ${esc(cols.category||'—')}</span><span class="badge neutral">Local: ${esc(cols.location||'—')}</span><span class="badge neutral">Status: ${esc(cols.status||'—')}</span></div>`:''}
      <div class="excel-preview">${excelPreviewHTML()}</div>
      <div class="panel-sub" style="margin-top:8px">Apenas a primeira aba é importada. Confirme a coluna de código identificada antes de usar em conferências reais. Os dados de demonstração continuam separados da planilha importada.</div>
    </div>
  </div>`;
}

/* =========================================================
   GLOBAL SEARCH / UI EVENTS
   ========================================================= */
function renderNav(){const pending=state.requests.filter(r=>stepsDone(r)<6).length;$('nav').innerHTML=NAV.map(([k,l,i])=>`<button class="${state.view===k?'active':''}" data-nav="${k}"><span class="ico">${i}</span><span>${l}</span>${k==='requests'&&pending?`<span class="nav-count">${pending}</span>`:''}</button>`).join('');}
function render(){renderNav();$('crumb').textContent=NAV.find(x=>x[0]===state.view)?.[1]||'Visão geral';let html='';if(state.view==='home')html=homePage();if(state.view==='assets')html=assetsPage();if(state.view==='reader')html=readerPage();if(state.view==='requests')html=requestsPage();if(state.view==='works')html=worksPage();if(state.view==='guide')html=guidePage();if(state.view==='settings')html=settingsPage();$('page').innerHTML=html;bind();if(state.view==='works')initMap();}
function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>{b.onclick=()=>setView(b.dataset.nav)});
  document.querySelectorAll('[data-go]').forEach(b=>{b.onclick=()=>setView(b.dataset.go)});
  const gs=$('globalSearch');
  gs.value=state.globalQuery;
  gs.oninput=e=>{state.globalQuery=e.target.value;if(['assets','works'].includes(state.view))render()};

  document.querySelectorAll('[data-open-asset]').forEach(b=>{b.onclick=()=>openAsset(b.dataset.openAsset)});

  if($('assetSearch')){
    $('assetSearch').oninput=e=>{state.globalQuery=e.target.value;render()};
    $('assetWork').onchange=e=>{
      const v=e.target.value;
      const q=state.globalQuery.trim().toLowerCase();
      const list=state.assets.filter(a=>
        (!q||[a.code,a.name,a.category,locationBy(a.locationId)?.name].join(' ').toLowerCase().includes(q))&&
        (!v||a.locationId===v)
      );
      const tbody=document.querySelector('tbody');
      if(tbody){
        tbody.innerHTML=list.length?list.map(a=>`<tr><td class="code">${esc(a.code)}</td><td>${esc(a.name)}</td><td class="muted">${esc(a.category)}</td><td>${esc(locationBy(a.locationId)?.name||'—')}</td><td><span class="badge blue">Disponível</span></td><td><button class="btn small" data-open-asset="${a.id}">Ver</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">Nenhum patrimônio encontrado.</div></td></tr>`;
        tbody.querySelectorAll('[data-open-asset]').forEach(b=>b.onclick=()=>openAsset(b.dataset.openAsset));
      }
    };
  }

  document.querySelectorAll('[data-request-tab]').forEach(b=>{b.onclick=()=>{state.requestTab=b.dataset.requestTab;render()}});
  document.querySelectorAll('[data-select-request]').forEach(b=>{b.onclick=()=>{state.selectedRequest=b.dataset.selectRequest;render()}});
  document.querySelectorAll('[data-task]').forEach(b=>{b.onclick=()=>{const [id,key]=b.dataset.task.split(':');toggleTask(id,key)}});
  document.querySelectorAll('[data-only-check]').forEach(b=>{b.onclick=e=>{e.stopPropagation();showChecklist(b.dataset.onlyCheck)}});
  document.querySelectorAll('[data-reader-link]').forEach(b=>{b.onclick=()=>{state.selectedRequest=b.dataset.readerLink;setView('reader');startSession()}});
  document.querySelectorAll('[data-guide]').forEach(b=>{b.onclick=()=>generateGuide(b.dataset.guide)});

  if($('startSession'))$('startSession').onclick=startSession;
  if($('cameraStartBtn'))$('cameraStartBtn').onclick=startCamera;
  if($('manualSession'))$('manualSession').onclick=startSession;
  if($('finishSession'))$('finishSession').onclick=finishSession;
  if($('editSession')&&state.activeSession)$('editSession').onclick=()=>notify('Você já está editando esta pasta');
  if($('scanAgain'))$('scanAgain').onclick=scanBarcode;
  if($('manualAssetLookupBtn'))$('manualAssetLookupBtn').onclick=manualLookup;
  if($('manualAssetLookup'))$('manualAssetLookup').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();manualLookup();}};
  if($('newAsset'))$('newAsset').onclick=addNewAsset;
  if($('capturePhoto'))$('capturePhoto').onclick=capturePhotoOnly;
  if($('captureAndProcess'))$('captureAndProcess').onclick=captureAndProcess;
  if($('hiddenFile'))$('hiddenFile').onchange=e=>{handlePhotoFiles(e.target.files);e.target.value=''};
  if($('addSessionPhotos'))$('addSessionPhotos').onchange=e=>{handlePhotoFiles(e.target.files);e.target.value=''};
  if($('ocrInput'))$('ocrInput').onchange=async e=>{for(const file of Array.from(e.target.files||[]))await processOCR(file);e.target.value='';};
  if($('excelFile'))$('excelFile').onchange=async e=>{const file=e.target.files?.[0];await importExcelFile(file);e.target.value='';};
  document.querySelectorAll('[data-remove-photo]').forEach(b=>{b.onclick=()=>{if(state.activeSession){state.activeSession.photos.splice(Number(b.dataset.removePhoto),1);render()}}});
  document.querySelectorAll('[data-edit-session]').forEach(b=>{b.onclick=()=>editSession(b.dataset.editSession)});
  document.querySelectorAll('[data-link-request]').forEach(b=>{b.onclick=()=>{const s=state.readerSessions.find(x=>x.id===b.dataset.linkRequest);const num=prompt('Número do pedido para vincular:',s?.requestId?requestBy(s.requestId)?.number:'');if(!num)return;const r=state.requests.find(x=>x.number===num.trim());if(!r){notify('Pedido não encontrado');return}s.requestId=r.id;s.title=`Pedido #${r.number} · ${locationBy(r.workId)?.name||'Obra'}`;notify('Pedido vinculado');render()}});
  if($('addManualAsset'))$('addManualAsset').onclick=manualAddAsset;
  if($('expandMap'))$('expandMap').onclick=()=>{state.expandedMap=!state.expandedMap;render()};
  if($('mapSearch'))$('mapSearch').oninput=e=>{state.globalQuery=e.target.value;render()};
  document.querySelectorAll('[data-focus-work]').forEach(b=>{b.onclick=()=>focusWork(b.dataset.focusWork)});
  if($('downloadCSV'))$('downloadCSV').onclick=downloadCSV;
  if($('printGuide'))$('printGuide').onclick=()=>window.print();
  if($('createRequest'))$('createRequest').onclick=createRequest;
  if($('saveSettings'))$('saveSettings').onclick=()=>{state.user=$('setUser').value.trim()||'Operador';state.company=$('setCompany').value.trim()||'SPECTRO CONSTRUTORA';$('userName').textContent=state.user;$('userCircle').textContent=initials(state.user);notify('Configuração atualizada');render()};
  if($('closeModal'))$('closeModal').onclick=()=>{$('checkModal').classList.remove('show')};
  if($('bell'))$('bell').onclick=()=>{state.showNotif=!state.showNotif;renderPopoverOnly()};
  if($('operator'))$('operator').onclick=()=>{state.showNotif=false;renderPopoverOnly()};
}
function renderPopoverOnly(kind){const box=$('popover');if(state.showNotif){const pending=state.requests.filter(r=>stepsDone(r)<6);box.innerHTML=`<div class="pop-title">Pendências do dia</div>${pending.slice(0,5).map(r=>`<div class="pop-row"><strong>#${esc(r.number)} · ${esc(locationBy(r.workId)?.name||'Obra')}</strong>${stepsDone(r)}/6 etapas · ${fmtDate(r.date)}</div>`).join('')||'<div class="pop-row">Nenhuma pendência aberta.</div>'}`;box.classList.add('show')}else{box.classList.remove('show');}}
function manualAddAsset(){if(!state.activeSession){notify('Inicie uma pasta primeiro');return;}const code=prompt('Número de patrimônio:');if(!code)return;const norm=code.trim().toUpperCase();if(!state.activeSession.assetCodes.includes(norm))state.activeSession.assetCodes.push(norm);render();}
function createRequest(){const number=$('newReqNumber').value.trim(),date=$('newReqDate').value,work=$('newReqWork').value,requester=$('newReqRequester').value.trim(),reason=$('newReqReason').value.trim()||'Solicitação',item=$('newReqItem').value.trim()||'Item não informado',qty=Math.max(1,Number($('newReqQty').value)||1),group=$('newReqGroup').value.trim()||'—';if(!number||!date||!requester){notify('Preencha número, data e solicitante');return}const r={id:'r'+Date.now(),number,date,workId:work,requester,reason,items:[{code:group,name:item,qty,patrimonyCodes:[]}],checklist:freshChecklist(),guide:`GUIA DE REMESSA OBRA ${locationBy(work)?.code||'000'}${date.replaceAll('-','')}`};r.checklist.pedido={done:true,by:state.user,at:new Date().toISOString()};state.requests.unshift(r);state.selectedRequest=r.id;state.requestTab='track';logAudit('criou solicitação','request',r.id);notify('Solicitação criada');render();}
function focusWork(id){state.selectedWork=id;if(state.map){const l=locationBy(id);state.map.setView([l.lat,l.lng],12);state.mapMarkers.find(m=>m.getLatLng().lat===l.lat)?.openPopup()}else{render()}}
function generateGuide(id){const r=requestBy(id);if(!r)return;const {jsPDF}=window.jspdf||{};if(!jsPDF){notify('PDF indisponível neste navegador');return}const doc=new jsPDF();const work=locationBy(r.workId);doc.setFillColor(12,22,35);doc.rect(0,0,210,28,'F');doc.setTextColor(245,166,35);doc.setFontSize(14);doc.text('GUIA DE REMESSA',14,16);doc.setTextColor(240,240,240);doc.setFontSize(8);doc.text(`${guideCode(r)} · ${fmtDate(r.date)}`,14,22);doc.setTextColor(25,35,45);doc.setFontSize(10);let y=40;doc.text(`Obra: ${work?.name||''}`,14,y);y+=7;doc.text(`Solicitante: ${r.requester}`,14,y);y+=7;doc.text(`Pedido: #${r.number}`,14,y);y+=11;r.items.forEach(i=>{doc.text(`${i.name} · ${i.qty}x`,14,y);y+=7});doc.save(`${guideCode(r).replaceAll(' ','_')}.pdf`);notify('Guia gerada')}

/* =========================================================
   INIT — APENAS UMA CHAMADA RENDER(); NADA ANTES
   ========================================================= */
$('userName').textContent=state.user;$('userCircle').textContent=initials(state.user);
$('bell').onclick=()=>{state.showNotif=!state.showNotif;renderPopoverOnly()};
$('operator').onclick=()=>{state.showNotif=false;renderPopoverOnly()};
$('closeModal').onclick=()=>$('checkModal').classList.remove('show');
render();
// Restaura somente a base Excel importada pelo operador; não cria nem semeia registros.
restoreExcelBase().catch(()=>{});
</script>
</body>
